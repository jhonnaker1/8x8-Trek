# Linker config for the C128 port.
#
# Copied from cc65's stock c128.cfg (2.19) with ONE change: BSS moves out of
# MAIN and into the C128's free RAM at $1300..$1BFF.
#
# WHY. MAIN is $1C0D..$B800, which is $A3F3 less the 2K stack, and the port
# filled it. When MSGS was written the linked binary had 395 bytes of MAIN
# left; the viewer needed 330 more than that. Every byte of BSS sitting in
# MAIN is a byte CODE cannot have, and 97% of what this port uses is code and
# read-only data -- so moving the small segment out is worth far more than its
# own size suggests.
#
# WHY $1300. It is the block between the KERNAL's work areas and the start of
# BASIC program text at $1C00, and the C128 leaves it alone. This port never
# returns to BASIC while it runs and drives the VDC rather than the VIC, so
# nothing of ours is there either.
#
# VERIFIED, not assumed (2026-08-23). $1300..$1BFF was filled with a rolling
# pattern through VICE's binary monitor while the port ran, and read back
# three times over thirty seconds: zero bytes changed, with the machine
# confirmed live between each read. The KERNAL's 60Hz IRQ is the only other
# thing executing and it does not touch this block.
#
# THE LIMIT OF THAT TEST, stated because it will matter later: the port was
# sitting on the title screen. It has done no disk I/O, because the port has
# none yet. When the disk seam lands, re-run the same experiment through an
# open-read-close cycle before trusting this -- KERNAL file handling is the
# one subsystem that allocates buffers, and it is the one this test did not
# exercise.
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2k stack, unchanged
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    # The free block. 2304 bytes, of which BSS currently uses about 650.
    LOWRAM:   file = "", define = yes, start = $1300, size = $0900;
    LOADADDR: file = %O,               start = $1BFF, size = $0002;
    HEADER:   file = %O,               start = $1C01, size = $000C;
    MAIN:     file = %O, define = yes, start = $1C0D, size = $A3F3 - __STACKSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = bss;
    # The one line that differs from stock.
    BSS:      load = LOWRAM,   type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
